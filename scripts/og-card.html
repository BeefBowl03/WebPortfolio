<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="stylesheet" href="/src/styles/main.css">
<style>
  html,body { margin:0; padding:0; background:#222; }
  .og {
    width: 1200px; height: 630px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    background: var(--c-bg);
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: var(--font-display);
  }
  /* the manifest grid, same language as the hero canvas */
  .og::before {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(245,243,238,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(245,243,238,.055) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .og > * { position: relative; z-index: 1; }

  .og__top { display:flex; align-items:center; justify-content:space-between; }
  .og__mark {
    font-family: var(--font-mono);
    font-size: 22px; font-weight:600; letter-spacing:.18em;
    color: var(--c-text); text-transform: uppercase;
  }
  .og__mark span { color: var(--c-accent); }
  .og__idx {
    font-family: var(--font-mono);
    font-size: 17px; letter-spacing:.16em;
    color: var(--c-text-muted); text-transform: uppercase;
  }

  .og__rule { height:1px; background:rgba(245,243,238,.18); }

  .og__h {
    font-size: 82px;
    font-weight: 800;
    font-variation-settings: 'wdth' 112;
    line-height: .92;
    letter-spacing: -.022em;
    color: var(--c-text);
    text-transform: uppercase;
    margin: 0;
  }
  .og__h em { font-style: normal; color: var(--c-accent); }
  .og__h b  { font-weight:800; color: var(--c-accent-2); }

  .og__sub {
    margin-top: 26px;
    font-family: var(--font-mono);
    font-size: 23px; letter-spacing:.02em;
    color: var(--c-text-2);
  }

  .og__foot { display:flex; align-items:center; gap:26px; padding-top:18px; border-top:1px solid rgba(245,243,238,.14); }
  .og__stat {
    font-family: var(--font-mono);
    font-size: 17px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--c-text-muted);
  }
  .og__stat b { color: var(--c-text); font-weight:600; }
  .og__dot { width:7px; height:7px; background:var(--c-accent-2); }
</style>
</head>
<body>
  <div class="og" id="og">
    <div class="og__top">
      <div class="og__mark">Celso Aquino<span>/</span></div>
      <div class="og__idx">Manifest № 01 — Philippines</div>
    </div>

    <div>
      <div class="og__rule" style="margin-bottom:38px"></div>
      <h1 class="og__h">Freelance<br><em>Shopify &amp; WordPress</em><br>Developer<b>.</b></h1>
      <p class="og__sub">Storefronts, internal tools, and the systems behind them.</p>
    </div>

    <div class="og__foot">
      <span class="og__dot"></span>
      <span class="og__stat"><b>13</b> Shipped builds</span>
      <span class="og__stat"><b>4</b> Countries</span>
      <span class="og__stat"><b>4+</b> Years building</span>
    </div>
  </div>
</body>
</html>
