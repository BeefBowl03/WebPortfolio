name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Least-privilege token: read the repo, write a Pages deployment, and mint the
# OIDC token that actions/deploy-pages exchanges for deploy credentials.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time. In-progress runs are allowed to finish so a
# half-uploaded artifact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires node ^20.19.0 || >=22.12.0
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
